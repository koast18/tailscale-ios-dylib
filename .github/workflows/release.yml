name: build-ios-dylib

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build iOS dylib / static archives / macOS dylib
        run: make ios-dylib

      - name: Verify dylib exports
        run: |
          set -eux
          nm -gU dist/ios/libtailscale.dylib | grep -E ' _tailscale_(new|set_proxy|set_disable_p2p|get_status_json|edit_prefs_json)$'
          nm -gU dist/ios-sim/libtailscale.dylib | grep -E ' _tailscale_(new|set_proxy|set_disable_p2p|get_status_json|edit_prefs_json)$'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tailscale-ios-dylib
          path: |
            dist/**
            tailscale.h

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          TAG="${GITHUB_REF_NAME}"
          # Use one archive so GitHub asset names do not collide (several
          # directories contain files named libtailscale.h/libtailscale.dylib).
          tar -czf "tailscale-ios-dylib-${TAG}.tar.gz" -C dist .
          gh release create "$TAG" \
            "tailscale-ios-dylib-${TAG}.tar.gz" \
            --title "Tailscale iOS dylib $TAG" \
            --notes "Proxy-only Tailscale embedded library built from this repository. See README.md for usage."
